<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Mehmet Karadeniz, 2026-2027">
<meta name="copyright" content="© Mehmet Karadeniz, 2026-2027. Tüm hakları saklıdır.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yegitek Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cep telefonu için saha uygulaması — üstte yapışkan okul şeridi, ortada tek sütun içerik, altta sekme çubuğu; tahtalar sınıf kartı ızgarası */
:root{
  --bg:#f1f4f2; --panel:#ffffff; --sunk:#e6ebe8; --line:#d3dbd6; --ink:#15201b; --muted:#56655d;
  --accent:#22574a; --accent-ink:#ffffff; --accent-soft:#d9eae3;
  --ok:#1d7d45; --ok-soft:#d8efe0; --warn:#985800; --warn-soft:#f8eacd; --bad:#b3281e; --bad-soft:#f8dbd7;
  --svc:#6447aa; --svc-soft:#e9e2f7; --off:#7d8a84; --off-soft:#e3e7e5;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#161e1b; --sunk:#1d2723; --line:#2a3631; --ink:#e2eae6; --muted:#93a39b;
  --accent:#7fc6aa; --accent-ink:#0a1f18; --accent-soft:#1a3a2f;
  --ok:#63ce8f; --ok-soft:#153322; --warn:#e8a94e; --warn-soft:#3a2a12; --bad:#f28a7f; --bad-soft:#3f1c19;
  --svc:#b8a1f0; --svc-soft:#2a2243; --off:#7f8c86; --off-soft:#242d29;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#161e1b; --sunk:#1d2723; --line:#2a3631; --ink:#e2eae6; --muted:#93a39b;
  --accent:#7fc6aa; --accent-ink:#0a1f18; --accent-soft:#1a3a2f;
  --ok:#63ce8f; --ok-soft:#153322; --warn:#e8a94e; --warn-soft:#3a2a12; --bad:#f28a7f; --bad-soft:#3f1c19;
  --svc:#b8a1f0; --svc-soft:#2a2243; --off:#7f8c86; --off-soft:#242d29;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo i{width:30px;height:22px;border-radius:4px;background:var(--accent);position:relative;flex:none}
.logo i::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:3px;margin-left:-6px;border-radius:2px;background:var(--accent);opacity:.6}
.logo h1{margin:0;font:800 21px/1 var(--f-disp);font-stretch:72%;letter-spacing:.01em;text-transform:uppercase}
.logo h1 span{color:var(--muted);font-weight:600}
/* Sürüm etiketi: her yayında artırılır (v1.3, v1.4 …) */
.ver{flex:none;font:500 11px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:3px 5px}
.hbtns{display:flex;gap:6px}
.hb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.hb:hover{background:var(--sunk)}
.sync{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 6px;border-radius:6px;white-space:nowrap}
.sync:hover{background:var(--sunk)}
.logo h1,.hb{white-space:nowrap}
@media (max-width:420px){.logo h1{font-size:18px}.hb{padding:6px 8px}}
.sync::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--sc,var(--muted))}
.sync[data-s="tamam"]{--sc:var(--ok)}
.sync[data-s="kaydediliyor"],.sync[data-s="yukleniyor"]{--sc:var(--warn)}
.sync[data-s="hata"],.sync[data-s="yetki"],.sync[data-s="yok"],.sync[data-s="cevrimdisi"]{--sc:var(--bad);color:var(--bad)}
@media (max-width:440px){.sync span{display:none}.sync{padding:8px}}
.okulbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-inline:-2px;padding-inline:2px}
.okulbar::-webkit-scrollbar{display:none}
.okul{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.okul[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.okul .dot{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 11px/19px var(--f-body);text-align:center}
.hint{color:var(--muted);font-size:13px;padding:7px 0}
.curbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.curbar b{font:800 18px/1.2 var(--f-disp);font-stretch:78%;min-width:0;overflow-wrap:anywhere}
.curbar .hb{flex:none}
.picker{display:flex;flex-direction:column;gap:10px}
.ph{margin:6px 2px 4px;font:800 28px/1.1 var(--f-disp);font-stretch:74%;text-wrap:balance}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;text-align:left;width:100%;padding:18px 16px;cursor:pointer}
.pick:hover{border-color:var(--accent)}
.pick .n{font:800 23px/1.15 var(--f-disp);font-stretch:76%;overflow-wrap:anywhere}
.pick .go{font:600 28px/1 var(--f-body);color:var(--accent)}
.pick .bar,.pick .s{grid-column:1/-1}
.pick .s{color:var(--muted);font-size:13.5px}
.pick .s b{color:var(--bad)}

/* Page */
.wrap{max-width:880px;margin:0 auto;padding-block:16px calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
h2.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -6px;font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h2.sec .lnk{font:600 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat b{font:800 34px/1 var(--f-disp);font-stretch:70%;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px;font-weight:500}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}

/* Status bar */
.durum{padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.bar .seg{min-width:6px}
.s-calisiyor{--c:var(--ok);--cs:var(--ok-soft)}.s-arizali{--c:var(--bad);--cs:var(--bad-soft)}.s-bakimda{--c:var(--warn);--cs:var(--warn-soft)}.s-serviste{--c:var(--svc);--cs:var(--svc-soft)}.s-kullanim{--c:var(--off);--cs:var(--off-soft)}
.bar .seg{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;cursor:pointer}
.lg::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c,var(--muted))}
.lg b{font-variant-numeric:tabular-nums}
.lg[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}

/* School cards (Tümü) */
.okulgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.ok-card{padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.ok-card:hover{border-color:var(--accent)}
.ok-card .n{font:800 19px/1.15 var(--f-disp);font-stretch:78%;overflow-wrap:anywhere}
.ok-card .s{color:var(--muted);font-size:13px}

/* Lists */
.list{display:flex;flex-direction:column;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row.nl{grid-template-columns:minmax(0,1fr) auto}
.list>:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.date{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;width:44px;line-height:1.15;text-transform:uppercase}
.date b{display:block;font:800 22px/1 var(--f-disp);font-stretch:70%;color:var(--ink)}
.cls{font:800 17px/1.1 var(--f-disp);font-stretch:72%;background:var(--sunk);border-radius:7px;padding:6px 8px;min-width:58px;max-width:96px;text-align:center;overflow-wrap:anywhere}
.day{padding:9px 14px 7px;background:var(--sunk);font-size:12.5px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);text-transform:capitalize}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--cs,var(--sunk));color:var(--c,var(--muted))}
.p-tamam{--c:var(--ok);--cs:var(--ok-soft)}.p-acik{--c:var(--bad);--cs:var(--bad-soft)}.p-beklemede{--c:var(--warn);--cs:var(--warn-soft)}
.note{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.empty{padding:30px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.more{border:0;border-top:1px solid var(--line);background:none;padding:11px;font-weight:600;color:var(--accent);cursor:pointer;width:100%}
.more:hover{background:var(--sunk)}

/* Todos */
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px 11px 14px;border-top:1px solid var(--line)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);font:800 15px var(--f-body);padding:0}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.chk:hover{border-color:var(--ok)}
.todo .t{overflow-wrap:anywhere}
.todo [data-todo]{cursor:pointer}
.tsubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tsub{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.tsub.on{text-decoration:line-through}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tgs{display:flex;flex-direction:column;gap:12px}
.tg{display:flex;flex-direction:column;gap:6px}
.tgh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tgh b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tgh .lnk{font:600 13px var(--f-body);color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 0}
.pill.w{--c:var(--warn);--cs:var(--warn-soft)}
.rz{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hbtns{flex-wrap:wrap;justify-content:flex-end}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0}
.srow .btn{flex:none;white-space:nowrap}
.tchips label{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer}
/* Tahta seçici: eşit boyutlu 3 sütunlu kutular; seçilen kutu renkli */
.tg .tchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tg .tchips label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;min-height:44px;padding:6px 4px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;user-select:none}
.tg .tchips label input{position:absolute;opacity:0;pointer-events:none}
.tg .tchips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--accent)}
.todo .ayr{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.todo .m{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* Sabit boy satırlar: uzun metin kısalır, tamamı dokununca/üzerine gelince */
.row,.todo{height:84px;box-sizing:border-box;overflow:hidden}
.row br{display:none}
.row>span:not(.pill):not(.date):not(.cls),.todo>div[data-todo]{min-width:0;overflow:hidden}
.row .t,.todo .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rz{display:none}
.todo .m{flex-wrap:nowrap;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.todo .m>*{margin-right:8px}
.todo .ayr{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;margin-top:1px}
.todo .tsubs{flex-wrap:nowrap;overflow-x:auto;margin-top:4px;padding-bottom:2px}
.todo .tsub{white-space:nowrap;flex:none;padding:2px 9px}
.x{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px;white-space:nowrap}
.x[data-sure]{color:var(--bad);background:var(--bad-soft)}

/* Tools */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;position:relative}
.search svg{position:absolute;left:11px;top:50%;margin-top:-8px;color:var(--muted);pointer-events:none}
.search input{padding-left:34px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.monthnav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;overflow:hidden}
.monthnav button{background:none;border:0;padding:9px;cursor:pointer;font:600 20px var(--f-body)}
.monthnav button:hover:not(:disabled){background:var(--sunk)}
.monthnav button:disabled{opacity:.3;cursor:default}
#mLbl{font:800 20px/1.1 var(--f-disp);font-stretch:75%;letter-spacing:.02em}
#mLbl small{display:block;font:500 11px var(--f-body);color:var(--accent)}
.quick{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .lg{flex:none}

/* Board tiles */
.lg.kt::before{display:none}
.lg.kt{padding:4px 12px}
h3.kat{margin:10px 2px 6px;font:700 13px var(--f-body);color:var(--muted);letter-spacing:.02em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
h3.kat span{font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (max-width:400px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;height:160px;padding:14px 12px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;min-width:0;overflow:hidden;box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
.tile:hover{border-color:var(--c)}
.tile .ts{font:800 24px/1.05 var(--f-disp);font-stretch:68%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tm{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sn{font:600 11.5px var(--f-mono,ui-monospace,monospace);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.tile .tf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.tile .rz{flex-wrap:nowrap;overflow:hidden;margin-top:2px}
.tile .rz .pill{font-size:11px;padding:2px 6px}
.tile .tf .mono{color:var(--muted)}
.tile.s-calisiyor .tf .pill{background:none;padding-left:0}

/* Tab bar + FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:600}
.tb svg{width:22px;height:22px}
.tb[aria-current="page"]{color:var(--accent)}
.tb[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tb .bd{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--f-body)}
.tb .bd.w{background:var(--warn)}
.fab{position:fixed;z-index:16;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 18px;font:700 15px var(--f-body);box-shadow:0 6px 20px rgba(10,40,30,.28);cursor:pointer}
.fab span{font-size:20px;line-height:1}

/* Sheets */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,18,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line);margin-bottom:4px}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:16px;padding-block:18px}.sheet::before{display:none}}
.sheet h3{margin:0;font:800 26px/1.1 var(--f-disp);font-stretch:74%}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:-6px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lb{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.seg button.s-arizali[aria-pressed="true"],.seg button.s-bakimda[aria-pressed="true"],.seg button.s-serviste[aria-pressed="true"],.seg button.s-calisiyor[aria-pressed="true"],.seg button.s-kullanim[aria-pressed="true"]{background:var(--cs);border-color:var(--c);color:var(--c)}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.del{color:var(--bad);margin-right:auto}
.btn.del[data-sure]{background:var(--bad-soft)}
.hist{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.hist .h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.hist .mono{color:var(--muted);padding-top:2px}
#lOut{min-height:220px;font:12.5px/1.55 var(--f-mono);white-space:pre;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.status{font-size:13px;color:var(--muted);text-align:center}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.5}}.toast{animation-name:tup}@keyframes tup{from{transform:translate(-50%,12px);opacity:0}}}

      <div class="hbtns">

  </div>

<div id="sheetRoot"></div>

<script>
const TAHTA_DURUM={calisiyor:"Çalışıyor",arizali:"Arızalı",bakimda:"Bakımda",serviste:"Serviste",kullanim:"Kullanım dışı"};
const T_ORDER=["arizali","serviste","bakimda","kullanim","calisiyor"];
const IS_DURUM={acik:"Açık",beklemede:"Beklemede",tamam:"Tamamlandı"};
const IS_TUR=["Arıza giderme","Güncelleme","İmaj","Kurulum","Kalem / dokunmatik","Ses / görüntü","Ağ / internet","Kullanıcı eğitimi","Envanter / sayım","Diğer"];
const TUR_G="Güncelleme",TUR_I="İmaj";
const AY_UZUN=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AY=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const TABS=["ozet","isler","yap","ariza","tahtalar"];

const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const S={okullar:[],tahtalar:[],isler:[],yapilacaklar:[],ayarlar:[],okul:"",tab:LS.get("yt2_tab")||"ozet",q:"",tf:"",gf:"",kat:"",durum:"",ay:"",db:null,
  loaded:{okullar:false,tahtalar:false,isler:false,yapilacaklar:false,ayarlar:false}};
if(!TABS.includes(S.tab))S.tab="ozet";

/* ---------- GitHub veri motoru ---------- */
const GH={owner:"karadenizmehmet-debug",repo:"Kayitlar",path:"yegitek/veri.json",branch:"main"};
const COLS=["okullar","tahtalar","isler","yapilacaklar","ayarlar"];
const D={token:LS.get("yt_token")||"",sha:null,etag:null,pending:[],busy:false,timer:null};
try{D.pending=JSON.parse(LS.get("yt_bekleyen")||"[]")}catch(e){D.pending=[]}
const bosVeri=()=>({surum:1,okullar:[],tahtalar:[],isler:[],yapilacaklar:[],ayarlar:[]});
let remote=bosVeri();
const yeniId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const kopya=o=>JSON.parse(JSON.stringify(o));
function b64dec(s){const bin=atob(String(s).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(str){const u=new TextEncoder().encode(str);let bin="";for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)}
const ghUrl=()=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
const ghHeaders=extra=>({Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+D.token,...extra});

function applyOp(data,op){
  const l=data[op.col]||(data[op.col]=[]);const i=l.findIndex(x=>x.id===op.id);
  if(op.t==="add"){if(i<0)l.push({id:op.id,...op.data})}
  else if(op.t==="upd"){if(i>=0)l[i]={...l[i],...op.data}}
  else if(op.t==="del"){if(i>=0)l.splice(i,1)}
}
function showLocal(){
  const d=kopya(remote);D.pending.forEach(op=>applyOp(d,op));
  COLS.forEach(c=>{S[c]=Array.isArray(d[c])?d[c]:[];S.loaded[c]=true});
  S.okullar.sort((a,b)=>(a.olusturma||0)-(b.olusturma||0));
  render();
}
function cacheYaz(){LS.set("yt_cache",JSON.stringify({sha:D.sha,etag:D.etag,data:remote}))}
function bekleyenYaz(){LS.set("yt_bekleyen",JSON.stringify(D.pending))}

const SYNC={yok:"Bağlan",yukleniyor:"Yükleniyor",kaydediliyor:"Kaydediliyor",tamam:"Kaydedildi",hata:"Kaydedilemedi",yetki:"Anahtar geçersiz",cevrimdisi:"Çevrimdışı"};
function setSync(s){
  const b=$("#sync");if(b){b.dataset.s=s;b.querySelector("span").textContent=SYNC[s]||"";b.setAttribute("aria-label","GitHub bağlantısı: "+(SYNC[s]||""))}
  const st=$("#status");if(!st)return;
  st.textContent=s==="hata"?"Değişiklikler GitHub'a yazılamadı. Bu cihazda saklanıyor; internet gelince tekrar denenecek."
    :s==="yetki"?"GitHub anahtarı geçersiz ya da süresi doldu. Üstteki durum düğmesinden yeni anahtar gir."
    :s==="cevrimdisi"?"İnternet yok. Değişiklikler bu cihazda saklanıyor."
    :s==="yukleniyor"&&!S.okullar.length?"Kayıtlar yükleniyor…":"";
}

async function fetchRemote(force){
  const h=ghHeaders(!force&&D.etag?{"If-None-Match":D.etag}:{});
  const r=await fetch(ghUrl()+"?ref="+encodeURIComponent(GH.branch),{headers:h,cache:"no-store"});
  if(r.status===304)return "ayni";
  if(r.status===401||r.status===403)throw {code:"token"};
  if(r.status===404){
    /* Dosya yoksa ilk kayıtta oluşturulur; repo hiç görünmüyorsa anahtarın izni yoktur. */
    const rr=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{headers:ghHeaders(),cache:"no-store"});
    if(!rr.ok)throw {code:"token"};
    remote=bosVeri();D.sha=null;D.etag=null;cacheYaz();return "yeni";
  }
  if(!r.ok)throw {code:"http",status:r.status};
  const j=await r.json();
  remote=JSON.parse(b64dec(j.content));D.sha=j.sha;D.etag=r.headers.get("ETag");cacheYaz();
  return "ok";
}
async function refresh(){
  if(!D.token||D.busy)return;
  setSync("yukleniyor");
  try{await fetchRemote();showLocal();if(D.pending.length)flush();else setSync("tamam")}
  catch(e){setSync(e&&e.code==="token"?"yetki":navigator.onLine?"hata":"cevrimdisi")}
}
const COLAD={okullar:"Okul",tahtalar:"Tahta",isler:"İş",yapilacaklar:"Yapılacak",ayarlar:"Ayar"},OPAD={add:"eklendi",upd:"güncellendi",del:"silindi"};
function ozet(ops){
  if(ops.length!==1)return `Yegitek: ${ops.length} değişiklik`;
  const o=ops[0],t=o.col==="tahtalar"?(o.data&&o.data.sinif)||(tahtaById(o.id)||{}).sinif:"";
  return `Yegitek: ${COLAD[o.col]||o.col} ${OPAD[o.t]}${t?" ("+t+")":""}`;
}
function queue(op){
  D.pending.push(op);bekleyenYaz();showLocal();setSync("kaydediliyor");
  clearTimeout(D.timer);D.timer=setTimeout(flush,700);
}
async function flush(){
  if(D.busy||!D.pending.length||!D.token)return;
  D.busy=true;setSync("kaydediliyor");
  const ops=D.pending.slice();
  try{
    for(let deneme=0;deneme<3;deneme++){
      const d=kopya(remote);ops.forEach(o=>applyOp(d,o));d.surum=1;d.guncelleme=new Date().toISOString();
      const body={message:ozet(ops),content:b64enc(JSON.stringify(d,null,1)+"\n"),branch:GH.branch};
      if(D.sha)body.sha=D.sha;
      const r=await fetch(ghUrl(),{method:"PUT",headers:ghHeaders({"Content-Type":"application/json"}),body:JSON.stringify(body)});
      if(r.status===409||r.status===422){await fetchRemote(true);continue}  /* başka cihaz yazmış: güncelini al, tekrar uygula */
      if(r.status===401||r.status===403||r.status===404)throw {code:"token"};
      if(!r.ok)throw {code:"http",status:r.status};
      const j=await r.json();
      remote=d;D.sha=j.content&&j.content.sha;D.etag=null;cacheYaz();
      D.pending=D.pending.slice(ops.length);bekleyenYaz();
      D.busy=false;showLocal();
      if(D.pending.length)flush();else setSync("tamam");
      return;
    }
    throw {code:"http"};
  }catch(e){
    D.busy=false;
    setSync(e&&e.code==="token"?"yetki":navigator.onLine?"hata":"cevrimdisi");
    if(!(e&&e.code==="token"))setTimeout(()=>{if(navigator.onLine)flush()},15000);
  }
}
window.addEventListener("online",()=>flush());

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
S.ay=today().slice(0,7);
const ayAdi=a=>{const [y,m]=a.split("-");return AY_UZUN[+m-1]+" "+y};
const ayKaydir=(a,n)=>{let [y,m]=a.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
const gunBaslik=d=>{const [y,m,g]=d.split("-").map(Number);if(!y)return "Tarihsiz";const w=new Date(y,m-1,g).toLocaleDateString("tr-TR",{weekday:"long"});const t=today();return (d===t?"Bugün · ":"")+g+" "+AY_UZUN[m-1]+", "+w};
const kisaTarih=d=>{if(!d)return "";const [,m,g]=d.split("-");return +g+" "+AY[+m-1]};
const trTarih=d=>{if(!d)return "";const [y,m,g]=d.split("-");return `${g}.${m}.${y}`};
const okulAd=id=>(S.okullar.find(o=>o.id===id)||{}).ad||"—";
const okulKisa=id=>{const o=S.okullar.find(o=>o.id===id);return o?(o.kisa||o.ad):"Genel"};
const tahtaById=id=>S.tahtalar.find(t=>t.id===id);
/* Yapılacak notu: tahtalar dizisi; eski kayıtlarda tek tahta `tahta` alanında. Birden fazla tahta varsa her tahta ayrı tikli (tdone). */
const tahtaIds=x=>Array.isArray(x.tahtalar)?x.tahtalar:(x.tahta?[x.tahta]:[]);
const tahtaDone=(x,tid)=>tahtaIds(x).length>1?!!(x.tdone&&x.tdone[tid]):!!x.tamam;
const tahtaAdlari=x=>tahtaIds(x).map(i=>(tahtaById(i)||{}).sinif||"Silinmiş tahta").join(" · ");
const hepsi=()=>S.okul==="hepsi";
const inOkul=x=>hepsi()||x.okul===S.okul;
const yIn=x=>hepsi()||!x.okul||x.okul===S.okul;
const pysAcik=x=>!!x.pys&&!x.tamam;
const norm=s=>String(s||"").toLocaleLowerCase("tr");
const sinifSort=(a,b)=>String(a.sinif).localeCompare(String(b.sinif),"tr",{numeric:true});
/* Kat: tahtada elle seçilmişse o; yoksa sınıf adından tahmin edilir (5-B…8-B → 2, 5-A…8-A → 3, vb.). */
const KATLAR={"g":"Giriş katı","1":"1. kat","2":"2. kat","3":"3. kat"};
const KAT_SIRA=["g","1","2","3","0"];
function katTahmin(sinif){
  /* Aksan/ı-i/ş-s farkı ve boşluklar yok sayılır: "Kız Mescidi", "KIZ MESCİT", "Ana sınıfı" hepsi eşleşir. */
  const n=String(sinif||"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ö/g,"o").replace(/ü/g,"u").replace(/[^a-z0-9-]/g,"");
  if(/^[5-8]-?b/.test(n)||n.includes("teknoloji"))return "2";
  if(/^[5-8]-?a/.test(n)||n.includes("mescit")||n.includes("mescid")||n.includes("bossinif"))return "3";
  if(n.includes("konferans")||n.includes("anaokul")||n.includes("anasinif")||n.includes("giris"))return "g";
  if(/^m-?[12]$/.test(n)||n.includes("kutuphane")||n.includes("fen"))return "1";
  return "";
}
/* Kat düzeni yalnızca Şehit Coşkun okulunda geçerli. */
const katOkul=id=>{const o=S.okullar.find(x=>x.id===id);return !!o&&norm((o.ad||"")+" "+(o.kisa||"")).includes("coşkun")};
const katOf=t=>katOkul(t.okul)?(t.kat||katTahmin(t.sinif)||"0"):"0";
const katAd=k=>KATLAR[k]||"Kat belirsiz";
const katSort=(a,b)=>KAT_SIRA.indexOf(katOf(a))-KAT_SIRA.indexOf(katOf(b))||sinifSort(a,b);
/* Ayarlar (tüm okullar için ortak): "Güncelleme var" / "Yeni imaj var" açılınca sürüm sayısı bir artar; sürümü düşük kalan tahta "güncel değil" sayılır.
   Güncelleme / İmaj türünde bir iş yapılınca tahta o güncel sürüme çekilir. */
const ayar=()=>S.ayarlar[0]||{};
const tahtaGuncelDegil=t=>!!ayar().gVar&&(t.gSurum||0)<(ayar().gSurum||0);
const tahtaEskiImaj=t=>!!ayar().iVar&&(t.iSurum||0)<(ayar().iSurum||0);
const rozetler=t=>[tahtaGuncelDegil(t)?"Güncel değil":"",tahtaEskiImaj(t)?"Eski imaj":""].filter(Boolean);
async function turIsle(tur,tids,tarih){
  const a=ayar(),d=tur===TUR_G?{gSurum:a.gSurum||0,gTarih:tarih}:tur===TUR_I?{iSurum:a.iSurum||0,iTarih:tarih}:null;
  if(!d)return;
  for(const tid of tids)if(tid&&tahtaById(tid))await save("tahtalar",tid,d);
}
async function ayarKaydet(patch){
  if(!D.token){baglantiSheet();return false}
  if(S.ayarlar.length)queue({t:"upd",col:"ayarlar",id:S.ayarlar[0].id,data:patch});
  else queue({t:"add",col:"ayarlar",id:"genel",data:{...patch,olusturma:Date.now()}});
  return true;
}
const isoGun=ms=>{const d=new Date(ms);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const girilen=x=>x.olusturma?kisaTarih(isoGun(x.olusturma)):"";
/* Yapıldı tiki: Güncelleme/İmaj türünü işler; arızalı / bakımda / serviste tahtayı, başka açık notu yoksa, çalışıyora döndürür. */
const SNAP=["durum","gSurum","gTarih","iSurum","iTarih"];
async function tamamSonrasi(x,tids){
  /* Geri alınabilsin diye tahtaların önceki hali nota yazılır. */
  const onceki={...(x.onceki||{})};
  tids.forEach(tid=>{const tb=tahtaById(tid);if(tb&&!onceki[tid])onceki[tid]=Object.fromEntries(SNAP.map(k=>[k,tb[k]??null]))});
  await save("yapilacaklar",x.id,{onceki});
  await turIsle(x.tur,tids,today());
  const donen=[];
  for(const tid of tids){
    const tb=tahtaById(tid);if(!tb||!["arizali","bakimda","serviste"].includes(tb.durum))continue;
    if(S.yapilacaklar.some(y=>y.id!==x.id&&!y.tamam&&tahtaIds(y).includes(tid)&&!tahtaDone(y,tid)))continue;
    await save("tahtalar",tid,{durum:"calisiyor"});donen.push(tb.sinif);
  }
  return donen;
}
async function geriAl(x,tids){
  const onceki={...(x.onceki||{})},donen=[];
  for(const tid of tids){
    const o=onceki[tid],tb=tahtaById(tid);if(!o)continue;
    delete onceki[tid];
    if(!tb)continue;
    const d={...o};if(tb.durum!=="calisiyor")delete d.durum;  /* arada elle değiştirilmişse durumuna dokunma */
    if(d.durum&&d.durum!==tb.durum)donen.push(tb.sinif);
    await save("tahtalar",tid,d);
  }
  await save("yapilacaklar",x.id,{onceki});
  return donen;
}

function todoRow(x,opts={}){

    ${opts.noDel?"":`<button class="x" type="button" data-del="${esc(x.id)}">Sil</button>`}</div>`;

function tahtaAra(){
  const q=norm(S.q);if(!q)return "";
  const l=S.tahtalar.filter(inOkul).filter(x=>norm([x.sinif,x.marka,x.seri,x.not,okulAd(x.okul),okulKisa(x.okul)].join(" ")).includes(q)).sort(sinifSort);

function renderIsler(){
  const q=norm(S.q);

    if(!q)return true;const t=tahtaById(x.tahta);return norm([x.aciklama,x.tur,t&&t.sinif,t&&t.seri,okulAd(x.okul)].join(" ")).includes(q)});

function renderYap(){

function renderAriza(){

/* ---------- Etiket okuma (seri no) ----------
   MEB envanter etiketi: 42.04.118.01.K1.05. Önce QR/barkod, olmazsa yazı (Tesseract.js, cihazda çalışır; fotoğraf hiçbir yere gönderilmez). */
const SERI_RE=/\d{2}\.\d{2}\.\d{2,3}\.\d{2}\.[A-Z]\d\.\d{2}/,KISA_RE=/\d{2}\.[A-Z]\d\.\d{2}/;
function seriBul(t){
  const n=String(t||"").toUpperCase().replace(/[,:;]/g,".").replace(/O/g,"0").replace(/[^0-9A-Z.\n ]/g,"");
  const satir=n.split("\n").map(l=>l.replace(/\s+/g,""));
  const tam=satir.concat(n.replace(/\s+/g,""));
  for(const l of tam){const m=l.match(SERI_RE);if(m)return m[0]}
  for(const l of satir){const m=l.match(KISA_RE);if(m)return m[0]}
  return "";
}
let tessYuk=null;
function tessYukle(){return tessYuk||(tessYuk=new Promise((ok,hata)=>{
  if(window.Tesseract)return ok(window.Tesseract);
  const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>{tessYuk=null;hata(new Error("yuklenemedi"))};document.head.appendChild(sc)}))}
async function etiketOku(file){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  if("BarcodeDetector" in window){
    try{const bd=new BarcodeDetector({formats:["qr_code","code_128","code_39"]});
      for(const b of await bd.detect(c)){const v=seriBul(b.rawValue);if(v)return v}}catch(e){}
  }
  const T=await tessYukle(),w=await T.createWorker("eng");
  try{await w.setParameters({tessedit_char_whitelist:"0123456789.ABCDEFGHIJKLMNOPQRSTUVWXYZ",tessedit_pageseg_mode:"11"});
    const {data}=await w.recognize(c);return seriBul(data.text)}
  finally{await w.terminate()}
}

   <div class="btns">${id?`<button type="button" class="btn del">Sil</button><button type="button" class="btn" data-is>+ Bu tahtaya iş</button>`:""}<button type="button" class="btn" data-x>Vazgeç</button><button class="btn pri" type="submit">Kaydet</button></div>`,
  f=>{
    bindSeg(f);
    f.querySelector("#tOkul").addEventListener("change",e=>{f.querySelector("#tKatBox").hidden=!katOkul(e.target.value)});
    const sb=f.querySelector("#tScanBtn"),sf=f.querySelector("#tScan"),sn=f.querySelector("#tScanNot");
    sb.onclick=()=>sf.click();
    sf.onchange=async()=>{const file=sf.files[0];if(!file)return;
      sb.disabled=true;sn.hidden=false;sn.textContent="Okunuyor… (ilk seferde birkaç saniye sürebilir)";
      try{const v=await etiketOku(file);
        if(v){f.querySelector("#tSeri").value=v;sn.textContent="Okundu: "+v+" — kontrol et, yanlışsa düzelt."}
        else sn.textContent="Okunamadı. Etiketi daha yakından, parlamasız ve düz çek."}
      catch(e){sn.textContent="Okunamadı (internet gerekli). Elle yazabilirsin."}
      sb.disabled=false;sf.value=""};
    const bi=f.querySelector("[data-is]");if(bi)bi.onclick=()=>{closeSheet();isSheet(null,id)};
    delConfirm(f,async()=>{if(await remove("tahtalar",id)){closeSheet();toast("Tahta silindi")}});
    f.onsubmit=async e=>{e.preventDefault();
      const sinif=f.tSinif.value.trim();if(!sinif){f.tSinif.focus();toast("Sınıf / yer adını yaz");return}
      const d={okul:f.tOkul.value,sinif,marka:f.tMarka.value.trim(),seri:f.tSeri.value.trim(),durum:segVal(f,"durum")||"calisiyor",kat:katOkul(f.tOkul.value)?f.tKat.value:"",not:f.tNot.value.trim()};
      const a=ayar(),gs=segVal(f,"gun"),is=segVal(f,"imaj");
      if(gs==="ok"){d.gSurum=a.gSurum||0;d.gTarih=today()}else if(gs==="no")d.gSurum=(a.gSurum||0)-1;
      if(is==="ok"){d.iSurum=a.iSurum||0;d.iTarih=today()}else if(is==="no")d.iSurum=(a.iSurum||0)-1;
      if(await save("tahtalar",id,d)){closeSheet();toast("Tahta kaydedildi")}};
  });
}
function ayarSheet(){
  const a=ayar(),t=S.tahtalar;
  const blok=(ad,yeni,var_,not_,say)=>`<div class="f"><span class="lb">${ad}</span>${seg(yeni,{"0":"Yok","1":"Var"},var_?"1":"0")}
    <input id="${yeni}Not" placeholder="Not (isteğe bağlı), ör. Pardus güncellemesi" value="${esc(not_||"")}" autocomplete="off">
    <div class="note" style="padding:0">${var_?`${say} tahta güncel değil. Güncelleme / İmaj türünde iş yapılan tahta güncel olur.`:"Var seçersen tüm okullardaki tahtalar güncel değil sayılır."}</div></div>`;
  openSheet(`<h3>Ayarlar</h3><div class="sub">Tüm okullardaki tahtalar için geçerli.</div>
   ${blok("Yeni güncelleme var","gun",a.gVar,a.gNot,t.filter(tahtaGuncelDegil).length)}
   ${blok("Yeni imaj var","imj",a.iVar,a.iNot,t.filter(tahtaEskiImaj).length)}
   <div class="btns"><button type="button" class="btn" data-x>Vazgeç</button><button class="btn pri" type="submit">Kaydet</button></div>`,
  f=>{
    bindSeg(f);
    f.onsubmit=async e=>{e.preventDefault();
      const gv=segVal(f,"gun")==="1",iv=segVal(f,"imj")==="1";
      const d={gVar:gv,iVar:iv,gNot:f.gunNot.value.trim(),iNot:f.imjNot.value.trim(),
        gSurum:(a.gSurum||0)+(gv&&!a.gVar?1:0),iSurum:(a.iSurum||0)+(iv&&!a.iVar?1:0)};
      if(await ayarKaydet(d)){closeSheet();toast("Ayarlar kaydedildi")}};
  });
}
function listeVeri(ok,tur,donem){
  const inP=d=>donem==="hepsi"||(d||"").startsWith(S.ay);
  const tad=id=>{const t=tahtaById(id);return t?t.sinif:""};
  const rows=[];
  if(tur!=="yapilan"){
    S.yapilacaklar.filter(x=>x.okul===ok&&!x.tamam).forEach(x=>rows.push({k:"bek",tarih:x.olusturma?new Date(x.olusturma).toISOString().slice(0,10):"",tahta:tahtaAdlari(x),tur:x.pys?"Arıza (PYS)":"Yapılacak",aciklama:x.metin+(x.ayrinti?" — "+x.ayrinti:""),durum:x.pys?"PYS açık":"Bekliyor"}));
    S.isler.filter(x=>x.okul===ok&&x.durum!=="tamam").forEach(x=>rows.push({k:"bek",tarih:x.tarih,tahta:tad(x.tahta),tur:x.tur,aciklama:x.aciklama,durum:IS_DURUM[x.durum]}));
  }
  if(tur!=="yapilacak"){
    S.isler.filter(x=>x.okul===ok&&x.durum==="tamam"&&inP(x.tarih)).forEach(x=>rows.push({k:"yap",tarih:x.tarih,tahta:tad(x.tahta),tur:x.tur,aciklama:x.aciklama,durum:"Tamamlandı"}));
    S.yapilacaklar.filter(x=>x.okul===ok&&x.tamam&&inP(x.bitis)).forEach(x=>rows.push({k:"yap",tarih:x.bitis,tahta:tahtaAdlari(x),tur:x.pys?"Arıza (PYS)":"Yapılacak",aciklama:x.metin+(x.ayrinti?" — "+x.ayrinti:"")+(x.sonuc?" — Yapılan: "+x.sonuc:""),durum:"Yapıldı"}));
  }
  rows.sort((a,b)=>(a.k===b.k?0:a.k==="bek"?-1:1)||(a.tarih||"").localeCompare(b.tarih||""));
  return rows;
}
function listeMetin(ok,tur,donem,rows){
  const per=donem==="hepsi"?"Tüm zamanlar":ayAdi(S.ay);
  const line=r=>`• ${r.tarih?trTarih(r.tarih)+" · ":""}${r.tahta?r.tahta+" · ":""}${r.tur&&r.tur!=="Yapılacak"?r.tur+": ":""}${r.aciklama||"—"}`;
  const bek=rows.filter(r=>r.k==="bek"),yap=rows.filter(r=>r.k==="yap");
  let t=okulAd(ok)+"\n";
  if(tur!=="yapilan")t+=`\nYAPILACAKLAR (${bek.length})\n`+(bek.length?bek.map(line).join("\n"):"Bekleyen iş yok.")+"\n";
  if(tur!=="yapilacak")t+=`\nYAPILANLAR — ${per} (${yap.length})\n`+(yap.length?yap.map(line).join("\n"):"Bu dönemde yapılan iş yok.")+"\n";
  t+=`\nHazırlayan: Mehmet Karadeniz (Yegitek okul sorumlusu), 2026-2027\nTarih: ${trTarih(today())}`;
  return t;
}
function listeSheet(){
  if(!S.okullar.length){okulSheet();return}
  const okOpts={};S.okullar.forEach(o=>okOpts[o.id]=o.kisa||o.ad);
  openSheet(`<h3>Liste al</h3><div class="sub">WhatsApp'a yapıştırmak ya da Excel'de açmak için</div>
   ${S.okullar.length>1?`<div class="f"><span class="lb">Okul</span>${seg("okul",okOpts,defOkul())}</div>`:""}
   <div class="f"><span class="lb">Ne listelensin?</span>${seg("tur",{yapilan:"Yapılanlar",yapilacak:"Yapılacaklar",hepsi:"İkisi de"},"yapilan")}</div>
   <div class="f"><span class="lb">Yapılanlar için dönem</span>${seg("donem",{ay:ayAdi(S.ay),hepsi:"Tüm zamanlar"},"ay")}</div>
   <div class="f"><label for="lOut">Önizleme</label><textarea id="lOut" readonly></textarea></div>
   <div class="btns"><button type="button" class="btn" data-x>Kapat</button><button type="button" class="btn" id="lCsv">Excel (CSV) indir</button><button type="button" class="btn pri" id="lCopy">Metni kopyala</button></div>`,
  f=>{
    bindSeg(f);
    let rows=[],ok=defOkul(),tur="yapilan",donem="ay";
    const upd=()=>{ok=segVal(f,"okul")||defOkul();tur=segVal(f,"tur");donem=segVal(f,"donem");rows=listeVeri(ok,tur,donem);f.lOut.value=listeMetin(ok,tur,donem,rows)};
    f.querySelectorAll("[data-seg]").forEach(s=>s.addEventListener("click",()=>setTimeout(upd)));
    upd();
    f.querySelector("#lCopy").onclick=()=>{const v=f.lOut.value;
      const done=()=>toast("Kopyalandı, WhatsApp'a yapıştırabilirsin");
      const fb=()=>{f.lOut.focus();f.lOut.select();toast("Metin seçildi, uzun basıp kopyala")};
      try{navigator.clipboard.writeText(v).then(done,fb)}catch(e){fb()}};
    f.querySelector("#lCsv").onclick=async()=>{
      const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
      const csv="﻿"+[["Liste","Tarih","Tahta","Tür","Açıklama","Durum"].map(q).join(";"),...rows.map(r=>[r.k==="bek"?"Yapılacak":"Yapılan",trTarih(r.tarih),r.tahta,r.tur,r.aciklama,r.durum].map(q).join(";"))].join("\r\n");
      const kisa=(S.okullar.find(o=>o.id===ok)||{}).kisa||"okul";
      const ad=`${kisa}-${tur==="yapilacak"?"yapilacaklar":tur==="yapilan"?"yapilanlar":"liste"}-${donem==="hepsi"?"tum":S.ay}.csv`;
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=ad;
        document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Dosya indirildi")}
      catch(e){toast("Dosya indirilemedi, metni kopyala")}};
  });
}
function okulSheet(){
  const satir=(o)=>`<div class="two" data-oid="${esc(o?o.id:"")}"><input aria-label="Okul adı" data-k="ad" placeholder="${o?"":"Yeni okul adı"}" value="${esc(o?o.ad:"")}"><input aria-label="Kısa ad" data-k="kisa" placeholder="Kısa ad (ör. NNİHO)" value="${esc(o?o.kisa||"":"")}"></div>`;
  openSheet(`<h3>Okullar</h3><div class="sub">Sorumlu olduğun okullar. Kısa ad üstteki şeritte görünür.</div>
   <div id="okulRows" style="display:flex;flex-direction:column;gap:8px">${S.okullar.map(satir).join("")}${satir(null)}</div>
   <button type="button" class="btn" id="okulEkle" style="align-self:flex-start">+ Bir satır daha</button>
   <div class="btns"><button type="button" class="btn" data-x>Vazgeç</button><button class="btn pri" type="submit">Kaydet</button></div>`,
  f=>{
    f.querySelector("#okulEkle").onclick=()=>{const d=document.createElement("div");d.innerHTML=satir(null);const el=d.firstChild;f.querySelector("#okulRows").appendChild(el);el.querySelector("input").focus()};
    f.onsubmit=async e=>{e.preventDefault();
      for(const r of f.querySelectorAll("[data-oid]")){
        const ad=r.querySelector('[data-k="ad"]').value.trim(),kisa=r.querySelector('[data-k="kisa"]').value.trim(),oid=r.dataset.oid;
        if(!ad)continue;
        const o=S.okullar.find(x=>x.id===oid);
        if(o&&o.ad===ad&&(o.kisa||"")===kisa)continue;
        await save("okullar",oid||null,{ad,kisa});
      }
      closeSheet();toast("Okullar kaydedildi")};
  });
}

/* ---------- Events ---------- */
function yapAc(){if(S.tab!=="yap")goTab("yap");todoSheet(null)}
function goTab(t){S.tab=t;S.q="";$("#q").value="";LS.set("yt2_tab",t);render();window.scrollTo(0,0)}
$("#tabbar").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)goTab(b.dataset.tab)});
$("#okulBar").addEventListener("click",e=>{if(e.target.closest("[data-degis]")){S.okul="";render();window.scrollTo(0,0)}});
$("#btnOkullar").onclick=okulSheet;
$("#btnAyar").onclick=ayarSheet;
$("#btnListe").onclick=listeSheet;
$("#mPrev").onclick=()=>{S.ay=ayKaydir(S.ay,-1);render()};
$("#mNext").onclick=()=>{const c=today().slice(0,7);if(S.ay<c){S.ay=ayKaydir(S.ay,1);render()}};
$("#mLbl").onclick=()=>{S.ay=today().slice(0,7);render()};
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("#fDurum").addEventListener("change",e=>{S.durum=e.target.value;render()});
$("#fab").onclick=()=>S.tab==="tahtalar"?tahtaSheet(null):S.tab==="yap"?todoSheet(null):S.tab==="ariza"?todoSheet(null,{pys:true}):isSheet(null);
$("#view").addEventListener("click",async e=>{
  if(e.target.closest("#ilkOkul")){okulSheet();return}
  if(e.target.closest("#ilkBag")){baglantiSheet();return}
  const c=e.target.closest("[data-chk]");
  const ts=e.target.closest("[data-tsub]");
  if(ts){const x=S.yapilacaklar.find(y=>y.id===ts.dataset.note);if(!x)return;
    const tid=ts.dataset.tsub,tdone={...(x.tdone||{})};
    if(tdone[tid])delete tdone[tid];else tdone[tid]=today();
    const tamam=tahtaIds(x).every(i=>tdone[i]);
    if(!await save("yapilacaklar",x.id,{tdone,tamam,bitis:tamam?today():""}))return;
    const tb=tahtaById(tid),donen=tdone[tid]?await tamamSonrasi(x,[tid]):await geriAl(x,[tid]);
    toast(tdone[tid]?(tb?tb.sinif:"")+" yapıldı"+(donen.length?", tekrar çalışıyor olarak işaretlendi":""):"Yapılacaklara geri alındı"+(donen.length?". "+donen.join(", ")+" eski durumuna döndü":""));
    return}
  if(c){const x=S.yapilacaklar.find(y=>y.id===c.dataset.chk);if(!x)return;const t=!x.tamam;const ids=tahtaIds(x);
    const tdone=t?Object.fromEntries(ids.map(i=>[i,today()])):{};
    if(await save("yapilacaklar",x.id,{tamam:t,bitis:t?today():"",tdone})){
      const donen=t?await tamamSonrasi(x,ids):await geriAl(x,ids);
      toast(t?"Yapıldı, Yapılanlar'a eklendi"+(donen.length?". "+donen.join(", ")+" tekrar çalışıyor":""):"Yapılacaklara geri alındı"+(donen.length?". "+donen.join(", ")+" eski durumuna döndü":""))}
    return}
  const u=e.target.closest("[data-undo]");
  if(u){const pl=u.querySelector(".pill");
    if(u.dataset.sure){const x=S.yapilacaklar.find(y=>y.id===u.dataset.undo);if(x&&await save("yapilacaklar",x.id,{tamam:false,bitis:"",tdone:{}})){const donen=await geriAl(x,tahtaIds(x));toast((x.pys?"Arızalı bölümüne":"Yapılacaklara")+" geri alındı"+(donen.length?". "+donen.join(", ")+" eski durumuna döndü":""))}}
    else{u.dataset.sure=1;pl.textContent="Geri al?";setTimeout(()=>{if(u.isConnected){delete u.dataset.sure;pl.textContent="Tamamlandı"}},3000)}
    return}
  const d=e.target.closest("[data-del]");
  if(d){if(d.dataset.sure){if(await remove("yapilacaklar",d.dataset.del))toast("Not silindi")}else{d.dataset.sure=1;d.textContent="Emin misin?";setTimeout(()=>{if(d.isConnected){delete d.dataset.sure;d.textContent="Sil"}},3000)}return}
  const td=e.target.closest("[data-todo]");if(td){todoSheet(td.dataset.todo);return}
  const az=e.target.closest("[data-ariza]");if(az){arizaSheet(az.dataset.ariza);return}
  const o=e.target.closest("[data-o]");if(o){okulSec(o.dataset.o);return}
  if(e.target.closest("[data-yapac]")){yapAc();return}
  const g=e.target.closest("[data-go]");if(g){if(g.dataset.tf!==undefined){S.tf=g.dataset.tf;S.gf=g.dataset.gf||""}goTab(g.dataset.go);return}
  const gf=e.target.closest("[data-gf]");if(gf&&!gf.dataset.go){S.gf=S.gf===gf.dataset.gf?"":gf.dataset.gf;render();return}
  const kt=e.target.closest("[data-kat]");if(kt){S.kat=kt.dataset.kat;render();return}
  const tf=e.target.closest("[data-tf]");if(tf){S.tf=tf.dataset.tf;if(S.tf==="")S.gf="";render();return}
  if(e.target.closest("[data-liste]")){listeSheet();return}
  const r=e.target.closest("[data-is],[data-tahta]");if(!r)return;
  if(r.dataset.is)isSheet(r.dataset.is);else tahtaSheet(r.dataset.tahta);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

render();

/* ---------- Veri: GitHub özel reposu ---------- */
/* Tüm kayıtlar tek bir JSON dosyasında durur. Okuma/yazma GitHub Contents API ile yapılır;
   token yalnızca bu tarayıcının localStorage'ında tutulur, koda girmez. */
function baglantiSheet(){
  openSheet(`<h3>GitHub bağlantısı</h3><div class="sub">Kayıtlar <span class="mono">${esc(GH.owner)}/${esc(GH.repo)}</span> reposundaki <span class="mono">${esc(GH.path)}</span> dosyasında tutulur.</div>
   <div class="f"><label for="gTok">Erişim anahtarı (token)</label><input id="gTok" type="password" class="mono" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div>
   <div class="hist"><b>Anahtar nasıl alınır</b>
    <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
     <li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
     <li>Repository access: <b>Only select repositories</b> → <span class="mono">${esc(GH.repo)}</span></li>
     <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
     <li>Oluşan anahtarı yukarıya yapıştır.</li>
    </ol>
    <span style="color:var(--muted)">Anahtar yalnızca bu tarayıcıda saklanır. Ortak kullanılan bir bilgisayardaysan işin bitince “Bağlantıyı kaldır”a bas.</span></div>
   <div class="btns">${D.token?`<button type="button" class="btn del">Bağlantıyı kaldır</button>`:""}<button type="button" class="btn" data-x>Vazgeç</button><button class="btn pri" type="submit">Bağlan</button></div>`,
  f=>{
    delConfirm(f,()=>{
      if(D.pending.length){toast("Kaydedilmemiş değişiklik var, önce kaydedilmesini bekle");return}
      D.token="";D.sha=null;D.etag=null;remote=bosVeri();
      LS.del("yt_token");LS.del("yt_cache");showLocal();setSync("yok");closeSheet();toast("Bağlantı kaldırıldı")});
    f.onsubmit=async e=>{e.preventDefault();
      const t=f.gTok.value.trim();if(!t){f.gTok.focus();return}
      const eski=D.token;D.token=t;D.etag=null;setSync("yukleniyor");
      try{await fetchRemote(true);LS.set("yt_token",t);closeSheet();showLocal();setSync("tamam");toast("Bağlandı");flush()}
      catch(err){D.token=eski;setSync(eski?"yetki":"yok");
        toast(err&&err.code==="token"?"Anahtar geçersiz ya da "+GH.repo+" reposuna izni yok":"Bağlanılamadı, interneti kontrol et")}};
  });
}
$("#sync").onclick=baglantiSheet;

(async()=>{
  try{const c=JSON.parse(LS.get("yt_cache")||"null");if(c&&c.data){remote=c.data;D.sha=c.sha;D.etag=c.etag}}catch(e){}
  showLocal();
  if(!D.token){setSync("yok");return}
  await refresh();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
  window.addEventListener("online",()=>refresh());
})();
</script>
